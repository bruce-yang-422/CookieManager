<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 咬痕：外層（輪廓）與內層（餅乾本體）各用一組遮罩，讓咬痕邊緣也有輪廓線 -->
  <defs>
    <mask id="bite-outer">
      <rect width="128" height="128" fill="#fff" />
      <circle cx="110" cy="18" r="24" fill="#000" />
      <circle cx="122" cy="48" r="13" fill="#000" />
    </mask>
    <mask id="bite-inner">
      <rect width="128" height="128" fill="#fff" />
      <circle cx="110" cy="18" r="31" fill="#000" />
      <circle cx="122" cy="48" r="20" fill="#000" />
    </mask>
  </defs>

  <!-- 輪廓 -->
  <circle cx="62" cy="66" r="58" fill="#7A4A1E" mask="url(#bite-outer)" />
  <!-- 餅乾本體 -->
  <circle cx="62" cy="66" r="50" fill="#F2B866" mask="url(#bite-inner)" />
  <!-- 烘烤紋理（右下陰影） -->
  <path d="M 104 78 A 50 50 0 0 1 30 104 A 46 46 0 0 0 104 78 Z" fill="#D9963F" mask="url(#bite-inner)" />

  <!-- 巧克力豆：大塊、少量，16px 下也清楚 -->
  <circle cx="40" cy="50" r="11" fill="#5A3212" />
  <circle cx="78" cy="78" r="12" fill="#5A3212" />
  <circle cx="40" cy="90" r="9" fill="#5A3212" />
  <circle cx="72" cy="42" r="7" fill="#5A3212" />
</svg>
